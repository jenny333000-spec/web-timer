<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컬러풀 인터랙티브 타이머</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for 알림 비프음 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes flashAlert {
      0%, 100% {
        background-color: #f43f5e; /* Rose 500 */
        box-shadow: 0 0 50px rgba(244, 63, 94, 0.8);
      }
      50% {
        background-color: #881337; /* Rose 900 */
        box-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
      }
    }
    .flashing-bg {
      animation: flashAlert 0.8s infinite ease-in-out;
    }

    @keyframes pulseScale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .pulse-notice {
      animation: pulseScale 1s infinite;
    }
  </style>
</head>
<body id="pageBody" class="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-4 transition-colors duration-500 font-sans select-none">

  <!-- 메인 타이머 카드 -->
  <div id="timerCard" class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl transition-all duration-300">
    
    <!-- 상단 헤더 -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2 text-indigo-400">
        <i data-lucide="clock" class="w-6 h-6"></i>
        <h1 class="text-xl font-bold tracking-wider">SMART TIMER</h1>
      </div>
      <span id="maxNotice" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-medium">최대 60분</span>
    </div>

    <!-- 시간 종료 알림 배너 (기본 숨김) -->
    <div id="alarmBanner" class="hidden mb-6 p-4 rounded-2xl bg-rose-600/30 border border-rose-500 text-center pulse-notice shadow-lg">
      <div class="flex items-center justify-center gap-2 text-rose-400 font-black text-xl mb-1">
        <i data-lucide="bell-ring" class="w-6 h-6 animate-bounce"></i>
        <span>⏰ 시간 종료!</span>
      </div>
      <p class="text-xs text-rose-200">설정된 시간이 모두 경과했습니다.</p>
    </div>

    <!-- 타이머 디스플레이 -->
    <div class="relative flex flex-col items-center justify-center py-8 px-4 bg-slate-950/70 rounded-2xl border border-slate-800/80 mb-6 shadow-inner">
      <div class="text-6xl sm:text-7xl font-mono font-black tracking-tight text-white drop-shadow-md" id="timeDisplay">
        00:00
      </div>
      <div class="flex items-center gap-6 mt-2 text-xs font-semibold uppercase tracking-widest text-slate-400">
        <span class="w-16 text-center">Minutes</span>
        <span class="w-16 text-center">Seconds</span>
      </div>

      <!-- 진행률 바 -->
      <div class="w-full bg-slate-800 h-2 rounded-full mt-6 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- 컨트롤 레이아웃 -->
    <div class="space-y-4">
      
      <!-- 1. 초 단위 조정 (+/- 1초) -->
      <div class="flex items-center gap-3">
        <button id="btnMinusSec" class="flex-1 py-3 px-4 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-rose-900/40 flex items-center justify-center gap-1.5 transition-all">
          <i data-lucide="minus" class="w-5 h-5"></i>
          <span>1초</span>
        </button>
        <button id="btnPlusSec" class="flex-1 py-3 px-4 bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-emerald-900/40 flex items-center justify-center gap-1.5 transition-all">
          <i data-lucide="plus" class="w-5 h-5"></i>
          <span>1초</span>
        </button>
      </div>

      <!-- 2. 빠른 분 추가 (+1분, +5분, +10분) - 누적 가능 (최대 60분) -->
      <div class="grid grid-cols-3 gap-2 sm:gap-3">
        <button id="btnAdd1Min" class="py-3 px-2 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 active:scale-95 text-white font-bold rounded-xl shadow-md shadow-indigo-900/30 text-sm flex items-center justify-center gap-1 transition-all">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>1분</span>
        </button>
        <button id="btnAdd5Min" class="py-3 px-2 bg-gradient-to-r from-purple-500 to-violet-600 hover:from-purple-600 hover:to-violet-700 active:scale-95 text-white font-bold rounded-xl shadow-md shadow-violet-900/30 text-sm flex items-center justify-center gap-1 transition-all">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>5분</span>
        </button>
        <button id="btnAdd10Min" class="py-3 px-2 bg-gradient-to-r from-fuchsia-500 to-pink-600 hover:from-fuchsia-600 hover:to-pink-700 active:scale-95 text-white font-bold rounded-xl shadow-md shadow-pink-900/30 text-sm flex items-center justify-center gap-1 transition-all">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>10분</span>
        </button>
      </div>

      <!-- 3. 시작/정지/리셋 컨트롤 -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <!-- 시작 / 일시정지 통합 제어 (기본 시작 / 동작 중 Stop) -->
        <button id="btnStartStop" class="py-3.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-emerald-950 flex items-center justify-center gap-2 text-base transition-all">
          <i id="startStopIcon" data-lucide="play" class="w-5 h-5 fill-current"></i>
          <span id="startStopText">START</span>
        </button>

        <!-- 리셋 버튼 -->
        <button id="btnReset" class="py-3.5 px-4 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 active:scale-95 text-white font-bold rounded-xl shadow-lg shadow-orange-950 flex items-center justify-center gap-2 text-base transition-all">
          <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
          <span>RESET</span>
        </button>
      </div>

    </div>

    <!-- 하단 상태 메시지 박스 -->
    <div id="statusMessage" class="mt-5 text-center text-xs text-slate-400 font-medium">
      시간을 설정한 후 START 버튼을 눌러주세요.
    </div>

  </div>

  <script>
    // 상수 및 상태 변수
    const MAX_SECONDS = 60 * 60; // 60분 (3600초)
    let currentSeconds = 0;      // 현재 남은 초
    let initialTotalSeconds = 0; // 진행률 계산용 초기 설정값
    let timerInterval = null;    // setInterval 핸들러
    let isRunning = false;       // 타이머 동작 상태
    let audioSynth = null;       // Tone.js Synth

    // DOM 요소 캐싱
    const pageBody = document.getElementById('pageBody');
    const timerCard = document.getElementById('timerCard');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressBar = document.getElementById('progressBar');
    const alarmBanner = document.getElementById('alarmBanner');
    const statusMessage = document.getElementById('statusMessage');

    const btnMinusSec = document.getElementById('btnMinusSec');
    const btnPlusSec = document.getElementById('btnPlusSec');
    const btnAdd1Min = document.getElementById('btnAdd1Min');
    const btnAdd5Min = document.getElementById('btnAdd5Min');
    const btnAdd10Min = document.getElementById('btnAdd10Min');
    const btnStartStop = document.getElementById('btnStartStop');
    const btnReset = document.getElementById('btnReset');
    const startStopIcon = document.getElementById('startStopIcon');
    const startStopText = document.getElementById('startStopText');

    // Lucide 아이콘 초기화
    lucide.createIcons();

    // 소리 재생 초기화 (Web Audio API)
    function playAlarmSound() {
      try {
        if (!audioSynth) {
          audioSynth = new Tone.PolySynth(Tone.Synth).toDestination();
        }
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        const now = Tone.now();
        audioSynth.triggerAttackRelease(['E5', 'G5'], '8n', now);
        audioSynth.triggerAttackRelease(['C6'], '8n', now + 0.2);
        audioSynth.triggerAttackRelease(['E5', 'G5'], '8n', now + 0.4);
        audioSynth.triggerAttackRelease(['C6'], '4n', now + 0.6);
      } catch (err) {
        console.warn("오디오 재생 불가:", err);
      }
    }

    // 디스플레이 갱신 함수
    function updateDisplay() {
      const minutes = Math.floor(currentSeconds / 60);
      const seconds = currentSeconds % 60;
      
      const formattedMins = String(minutes).padStart(2, '0');
      const formattedSecs = String(seconds).padStart(2, '0');

      timeDisplay.textContent = `${formattedMins}:${formattedSecs}`;

      // 진행률 계산
      if (initialTotalSeconds > 0 && currentSeconds > 0) {
        const percent = ((initialTotalSeconds - currentSeconds) / initialTotalSeconds) * 100;
        progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
      } else {
        progressBar.style.width = currentSeconds === 0 ? '0%' : '100%';
      }
    }

    // 시간 수정 (초 단위 추가/감소, 최대 60분 제한 적용)
    function adjustTime(deltaSeconds) {
      if (isFlashing()) {
        clearAlarm();
      }

      let target = currentSeconds + deltaSeconds;
      if (target > MAX_SECONDS) {
        target = MAX_SECONDS;
        showNotice("최대 시간은 60분입니다.");
      } else if (target < 0) {
        target = 0;
      }

      currentSeconds = target;
      if (!isRunning) {
        initialTotalSeconds = currentSeconds;
      }
      updateDisplay();
    }

    // 알림 및 애니메이션 해제
    function clearAlarm() {
      pageBody.classList.remove('flashing-bg');
      alarmBanner.classList.add('hidden');
    }

    function isFlashing() {
      return pageBody.classList.contains('flashing-bg');
    }

    // 시간 종료 시 트리거
    function triggerTimeout() {
      stopTimer();
      currentSeconds = 0;
      updateDisplay();

      // 화면 깜빡임 애니메이션 및 알림창 활성화
      pageBody.classList.add('flashing-bg');
      alarmBanner.classList.remove('hidden');
      statusMessage.textContent = "시간이 종료되었습니다! 리셋을 누르거나 새 시간을 추가하세요.";

      playAlarmSound();
    }

    // 시작
    function startTimer() {
      if (currentSeconds <= 0) {
        showNotice("타이머 시간을 먼저 추가해 주세요!");
        return;
      }

      clearAlarm();
      isRunning = true;
      initialTotalSeconds = Math.max(initialTotalSeconds, currentSeconds);
      
      // 버튼 UI -> STOP 모드로 변경
      btnStartStop.classList.remove('from-emerald-500', 'to-teal-600', 'hover:from-emerald-600', 'hover:to-teal-700');
      btnStartStop.classList.add('from-rose-600', 'to-red-700', 'hover:from-rose-700', 'hover:to-red-800');
      startStopText.textContent = "STOP";
      startStopIcon.setAttribute('data-lucide', 'square');
      lucide.createIcons();

      statusMessage.textContent = "타이머가 동작 중입니다...";

      timerInterval = setInterval(() => {
        if (currentSeconds > 0) {
          currentSeconds--;
          updateDisplay();
          if (currentSeconds === 0) {
            triggerTimeout();
          }
        } else {
          triggerTimeout();
        }
      }, 1000);
    }

    // 정지 (STOP)
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      isRunning = false;

      // 버튼 UI -> START 모드로 변경
      btnStartStop.classList.add('from-emerald-500', 'to-teal-600', 'hover:from-emerald-600', 'hover:to-teal-700');
      btnStartStop.classList.remove('from-rose-600', 'to-red-700', 'hover:from-rose-700', 'hover:to-red-800');
      startStopText.textContent = "START";
      startStopIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();

      if (!isFlashing()) {
        statusMessage.textContent = "타이머가 일시정지되었습니다.";
      }
    }

    // 초기화 (RESET)
    function resetTimer() {
      stopTimer();
      clearAlarm();
      currentSeconds = 0;
      initialTotalSeconds = 0;
      updateDisplay();
      statusMessage.textContent = "시간이 초기화되었습니다. 시간을 설정해주세요.";
    }

    // 토스트 안내 메시지
    let noticeTimeout = null;
    function showNotice(msg) {
      statusMessage.textContent = msg;
      statusMessage.classList.add('text-amber-400');
      clearTimeout(noticeTimeout);
      noticeTimeout = setTimeout(() => {
        statusMessage.classList.remove('text-amber-400');
        if (isRunning) {
          statusMessage.textContent = "타이머가 동작 중입니다...";
        } else {
          statusMessage.textContent = "시간을 설정한 후 START 버튼을 눌러주세요.";
        }
      }, 2500);
    }

    // 이벤트 리스너 연결
    btnPlusSec.addEventListener('click', () => adjustTime(1));
    btnMinusSec.addEventListener('click', () => adjustTime(-1));

    // 클릭 시 누적 추가 (+1분, +5분, +10분)
    btnAdd1Min.addEventListener('click', () => adjustTime(60));
    btnAdd5Min.addEventListener('click', () => adjustTime(5 * 60));
    btnAdd10Min.addEventListener('click', () => adjustTime(10 * 60));

    // Start / Stop 토글
    btnStartStop.addEventListener('click', () => {
      if (isRunning) {
        stopTimer();
      } else {
        startTimer();
      }
    });

    // Reset
    btnReset.addEventListener('click', resetTimer);

    // 최초 렌더링
    updateDisplay();
  </script>
</body>
</html>
